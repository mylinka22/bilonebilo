<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Admin Panel</title>
    <style>
        :root {
            --primary: #a78bfa;
            --bg: #111827;
            --card: #1f2937;
            --text: #f3f4f6;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { color: var(--primary); text-align: center; }
        .form-group {
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        textarea {
            width: 100%;
            background: #374151;
            border: 1px solid #4b5563;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
            resize: vertical;
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button.delete { background: #ef4444; }
        button.edit { background: #3b82f6; }
        .question-card {
            background: var(--card);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .question-content { flex: 1; margin-right: 15px; }
        .actions { display: flex; gap: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛠 Mini Admin Panel</h1>
        
        <div class="form-group">
            <h3>Добавить новый вопрос</h3>
            <textarea id="newQuestionText" rows="3" placeholder="Введите текст вопроса..."></textarea>
            <button onclick="addQuestion()">➕ Добавить</button>
        </div>

        <div id="questionsList"></div>
    </div>

    <script>
        async function fetchQuestions() {
            const res = await fetch('/api/questions');
            const questions = await res.json();
            const list = document.getElementById('questionsList');
            list.innerHTML = '';
            questions.forEach(q => {
                const div = document.createElement('div');
                div.className = 'question-card';
                div.innerHTML = `
                    <div class="question-content">${q.text}</div>
                    <div class="actions">
                        <button class="edit" onclick="editQuestion(${q.id}, '${q.text.replace(/'/g, "\\'")}')">✏️</button>
                        <button class="delete" onclick="deleteQuestion(${q.id})">🗑️</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        async function addQuestion() {
            const text = document.getElementById('newQuestionText').value;
            if (!text) return;
            await fetch('/api/questions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });
            document.getElementById('newQuestionText').value = '';
            fetchQuestions();
        }

        async function deleteQuestion(id) {
            if (!confirm('Вы уверены?')) return;
            await fetch(\`/api/questions/\${id}\`, { method: 'DELETE' });
            fetchQuestions();
        }

        async function editQuestion(id, oldText) {
            const newText = prompt('Редактировать вопрос:', oldText);
            if (newText === null || newText === oldText) return;
            await fetch(\`/api/questions/\${id}\`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: newText })
            });
            fetchQuestions();
        }

        fetchQuestions();
    </script>
</body>
</html>
