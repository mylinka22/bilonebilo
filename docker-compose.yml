services:
  db:
    image: postgres:15-alpine
    container_name: bilonebilo-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-bilonebilo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - bilonebilo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bilonebilo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bilonebilo-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-bilonebilo}?sslmode=disable
      - ADMIN_TELEGRAM_IDS=${ADMIN_TELEGRAM_IDS}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bilonebilo-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://backend:3000/api}
        - VITE_ADMIN_TELEGRAM_IDS=${VITE_ADMIN_TELEGRAM_IDS}
    container_name: bilonebilo-frontend
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bilonebilo-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    container_name: bilonebilo-admin-panel
    restart: unless-stopped
    ports:
      - "${ADMIN_PANEL_PORT:-8083}:8083"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-bilonebilo}?sslmode=disable
      - ADMIN_PANEL_PORT=8083
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bilonebilo-network

volumes:
  postgres_data:

networks:
  bilonebilo-network:
    driver: bridge

